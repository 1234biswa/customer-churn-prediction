artifacts:
  model_dir: "models"
  preprocessor_name: "preprocessor.joblib"
  model_name: "best_churn_model.joblib"

data:
  raw_path: "data/raw/Telco-Customer-Churn.csv"
  processed_path: "data/processed/cleaned_churn_data.csv"
  target_column: "Churn"
  test_size: 0.2
  random_state: 42

model_training:
  cv_folds: 5
  scoring_metric: "roc_auc"
  smote_sampling_strategy: "auto"

risk_thresholds:
  low: 0.30
  medium: 0.65
  high: 1.00

api:
  title: "Customer Churn Prediction API"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8000
